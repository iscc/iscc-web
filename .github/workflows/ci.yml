# Continuous integration. Every check is a command an agent or human can run locally:
#
#   test      ->  uv run poe test
#   lint      ->  uv run prek run --all-files
#   frontend  ->  pnpm install && pnpm exec eslint frontend/ && pnpm exec vue-tsc --noEmit
#                 && pnpm run test && pnpm run build
#   docker    ->  docker build -t iscc-web:smoke . && docker run -p 8000:8000 iscc-web:smoke
#                 (hadolint: docker run --rm -v "$PWD:/repo" -w /repo hadolint/hadolint hadolint Dockerfile)
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Cancel stale in-flight PR runs; let branch-push runs complete so :main publishing isn't cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
      fail-fast: false
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version-file: .tool-versions  # uv (and Python) versions come from .tool-versions
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      # Cache the iscc-sct/iscc-sci ONNX models across runs. Parallel pytest-xdist workers
      # would otherwise race on the download and can produce a corrupt ONNX file.
      - name: Cache semantic-code models
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.local/share/iscc-sct
            ~/.local/share/iscc-sci
            ~\AppData\Local\iscc\iscc-sct
            ~\AppData\Local\iscc\iscc-sci
          key: iscc-models-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            iscc-models-${{ runner.os }}-

      - name: Pre-download semantic-code models (serial, before parallel tests)
        run: |
          uv run python - <<'EOF'
          import iscc_sct.utils
          import iscc_sci.utils
          iscc_sct.utils.get_model()
          iscc_sci.utils.get_model()
          print("semantic-code models ready")
          EOF

      - name: Run tests  # local parity: uv run poe test
        run: uv run poe test

  lint:
    name: Lint (prek hooks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version-file: .tool-versions  # uv (and Python) versions come from .tool-versions
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Cache prek hook environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/prek
          key: prek-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            prek-${{ runner.os }}-

      - name: Run prek hooks  # local parity: uv run prek run --all-files
        run: uv run prek run --all-files

  frontend:
    name: Frontend (eslint, vue-tsc, vitest, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm  # version comes from the packageManager field in package.json
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
          cache: pnpm

      - name: Install dependencies  # local parity: pnpm install
        run: pnpm install --frozen-lockfile

      - name: Lint  # local parity: pnpm exec eslint frontend/
        run: pnpm exec eslint frontend/

      - name: Type check  # local parity: pnpm exec vue-tsc --noEmit
        run: pnpm exec vue-tsc --noEmit

      - name: Test  # local parity: pnpm run test
        run: pnpm run test

      - name: Build  # local parity: pnpm run build
        run: pnpm run build

  docker:
    name: Docker (hadolint, build, smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
          config: .hadolint.yaml

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image (load into local daemon)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          # CPU stage only: the GPU stage is last (default) but is huge and never smoke-tested here.
          target: prod-runtime
          load: true
          tags: iscc-web:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run container and probe endpoints
        run: |
          docker run -d --name iscc-web-smoke -p 8000:8000 iscc-web:smoke
          trap 'echo "--- container logs ---"; docker logs iscc-web-smoke; docker rm -f iscc-web-smoke' EXIT
          # Wait up to 60s for the app to come up
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/ > /dev/null; then
              echo "Up after ${i} attempts"
              break
            fi
            sleep 2
          done
          # Frontend index is served
          curl -sf http://localhost:8000/ > /dev/null
          # Backend API answers: explain a known ISCC
          curl -sf "http://localhost:8000/api/v1/explain/ISCC:KMDMRJYGHHVRCZ5TM6U4G6D4MXA6LAXC4ZRPOKFU7JBEQXR2BJOS6NA"
          # Docker HEALTHCHECK turns healthy once GET /health answers 200 (ONNX models loaded)
          for i in $(seq 1 60); do
            [ "$(docker inspect --format '{{.State.Health.Status}}' iscc-web-smoke)" = healthy ] && break
            sleep 2
          done
          curl -sf http://localhost:8000/health && echo
          [ "$(docker inspect --format '{{.State.Health.Status}}' iscc-web-smoke)" = healthy ]

  # Publish the :main image on pushes to main, after all checks pass. Nothing auto-pulls
  # :main, so this is safe by itself. `latest=false` is deliberate: demo.iscc.io pins
  # ghcr.io/iscc/iscc-web:latest (2022 image) and must never receive a new image under
  # that tag — see also release.yml.
  publish-main:
    name: Publish Docker image (:main)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, lint, frontend, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
          tags: |
            type=ref,event=branch

      - name: Build and push (CPU :main)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          # Pin the CPU stage so the plain :main tag never gets the GPU (last/default) stage.
          target: prod-runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # GET /health reports the same version/revision as the OCI labels.
          build-args: |
            VERSION=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.version'] }}
            REVISION=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.revision'] }}
          cache-from: type=gha

  # Build the opt-in CUDA image. Runs on pushes (main + the working branch) and manual dispatch,
  # NEVER on PRs — the ~3 GB CUDA base is too costly for every PR. Build-only proves the image
  # compiles and its imports resolve (the in-image model bake runs Python against the GPU venv);
  # functional GPU inference is verified manually on the GPU host, not in CI (runners have no GPU).
  # Pushes :main-gpu only on main; on the working branch it builds without pushing (verification).
  docker-gpu:
    name: Docker GPU (build; push :main-gpu on main)
    if: github.event_name != 'pull_request'
    needs: [test, lint, frontend, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
            suffix=-gpu
          tags: |
            type=ref,event=branch

      - name: Build (and push :main-gpu on main)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          target: prod-runtime-gpu
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # GET /health reports the same version/revision as the OCI labels.
          build-args: |
            VERSION=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.version'] }}
            REVISION=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.revision'] }}
          # Separate gha cache scope so the CUDA layers never evict the CPU image's cache.
          cache-from: type=gha,scope=gpu
          cache-to: type=gha,mode=max,scope=gpu
