# Release pipeline: a published GitHub release (tag vX.Y.Z) runs the test suite, then
# publishes the Docker image to ghcr.io under immutable semver tags ONLY.
#
# IMPORTANT: `flavor: latest=false` is deliberate. demo.iscc.io pins
# ghcr.io/iscc/iscc-web:latest and still runs a 2022 image; publishing :latest again would
# silently upgrade it on the next manual `docker compose pull`. Reintroduce :latest only
# after demo.iscc.io is retired (or pinned to its image digest).
name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version-file: .tool-versions  # uv (and Python) versions come from .tool-versions
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      # Cache the iscc-sct/iscc-sci ONNX models across runs (same plumbing as ci.yml). Parallel
      # pytest-xdist workers would otherwise race on the download and can corrupt the ONNX file.
      - name: Cache semantic-code models
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.local/share/iscc-sct
            ~/.local/share/iscc-sci
            ~\AppData\Local\iscc\iscc-sct
            ~\AppData\Local\iscc\iscc-sci
          key: iscc-models-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            iscc-models-${{ runner.os }}-

      - name: Pre-download semantic-code models (serial, before parallel tests)
        run: |
          uv run python - <<'EOF'
          import iscc_sct.utils
          import iscc_sci.utils
          iscc_sct.utils.get_model()
          iscc_sci.utils.get_model()
          print("semantic-code models ready")
          EOF

      - name: Run tests  # local parity: uv run poe test
        run: uv run poe test

  publish-docker:
    name: Publish Docker image (semver tags)
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- CPU image (default, slim base): :X.Y.Z and :X.Y ---
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          # No :latest, ever — see header comment.
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push (CPU)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          # Pin the CPU stage: appending the GPU stage makes it the last (default) stage, so an
          # untargeted build would silently publish the ~3 GB CUDA image under the plain tags.
          target: prod-runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # GET /health reports the same version/revision as the OCI labels.
          build-args: |
            VERSION=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.version'] }}
            REVISION=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.revision'] }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- GPU image (opt-in CUDA base): :X.Y.Z-gpu and :X.Y-gpu ---
      - id: meta-gpu
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
            suffix=-gpu
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push (GPU)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          target: prod-runtime-gpu
          push: true
          tags: ${{ steps.meta-gpu.outputs.tags }}
          labels: ${{ steps.meta-gpu.outputs.labels }}
          # GET /health reports the same version/revision as the OCI labels.
          build-args: |
            VERSION=${{ fromJSON(steps.meta-gpu.outputs.json).labels['org.opencontainers.image.version'] }}
            REVISION=${{ fromJSON(steps.meta-gpu.outputs.json).labels['org.opencontainers.image.revision'] }}
          cache-from: type=gha,scope=gpu
          cache-to: type=gha,mode=max,scope=gpu
