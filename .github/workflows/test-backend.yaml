name: Test Backend

on:
  push:
    branches:
      - main
      - v0.3.0
  pull_request:

jobs:
  test_backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install Taglib
        run: sudo apt-get install -y libtag1-dev

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.7"

      - name: Install Dependencies
        run: uv sync --frozen

      - name: Run Tests
        run: uv run pytest
