repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^media/
      - id: check-added-large-files
        exclude: ^uv\.lock$
      - id: end-of-file-fixer
        exclude: ^media/
      - id: fix-byte-order-marker
        exclude: ^media/
      - id: check-json
      - id: check-toml
      - id: check-yaml
        # pnpm-lock.yaml holds two documents: the pinned pnpm itself, then the project dependencies.
        args: [--allow-multiple-documents]
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: ^media/
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4
    hooks:
      - id: ruff-format
      - id: ruff-check
        args: [--fix]
  - repo: local
    hooks:
      - id: copy-changelog
        name: sync docs changelog from CHANGELOG.md
        entry: uv run python -m develop.copy_changelog
        language: system
        files: ^(CHANGELOG\.md|docs/development/changelog\.md)$
        pass_filenames: false
  - repo: https://github.com/executablebooks/mdformat
    rev: 1.0.0
    hooks:
      - id: mdformat
        additional_dependencies:
          - "mdformat-mkdocs[recommended]"
  - repo: https://github.com/python-openapi/openapi-spec-validator
    rev: 0.9.0
    hooks:
      - id: openapi-spec-validator
        files: ^iscc_web/static/docs/openapi\.yaml$
