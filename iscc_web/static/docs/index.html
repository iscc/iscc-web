<!doctype html>
<html lang="en">
  <head>
    <title>ISCC-WEB Generator API - Documentation</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="/images/iscc-logo-icon-black.svg" />
    <script src="https://unpkg.com/@stoplight/elements/web-components.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/@stoplight/elements/styles.min.css" />
    <style>
      /* Override inline max-width on right panel to allow full width for long ISCC strings */
      .sl-elements .sl-relative.sl-w-2\/5.sl-ml-16 {
        max-width: none !important;
      }

      /* Enable horizontal scrolling for code blocks */
      .sl-elements pre {
        overflow-x: auto !important;
        white-space: pre !important;
      }

      .sl-elements code {
        white-space: pre !important;
      }
    </style>
  </head>
  <body>
    <elements-api
      apiDescriptionUrl="/docs/openapi.yaml"
      router="hash"
      layout="sidebar"
      hideExport="true"
      logo="/images/iscc-logo-icon-black.svg"
    />
  </body>
</html>
