[project]
name = "iscc-web"
version = "0.2.0"
description = "ISCC - Generator Web Application"
authors = [{ name = "Titusz", email = "tp@py7.de" }]
requires-python = ">=3.8,<3.11"
readme = "README.md"
license = "Apache-2.0"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
]
dependencies = [
    "blacksheep>=1.2,<2",
    "uvicorn>=0.18,<0.19",
    "aiofiles>=22.1,<23",
    "iscc-sdk==0.5.1",
    "httpx>=0.23,<0.24",
    "pathvalidate>=2.5,<3",
    "aiofile>=3.8,<4",
    "jinja2-simple-tags>=0.4,<0.5",
    "gunicorn>=20.1,<21",
    "sentry-sdk>=1.9,<2",
    "watchfiles>=0.17.0,<0.18",
]

[project.urls]
Homepage = "https://github.com/iscc/iscc-web"

[project.scripts]
iscc-web = "iscc_web.main:main"

[dependency-groups]
dev = [
    "pytest>=7.1,<8",
    "black>=22.8,<23",
    "poethepoet>=0.16,<0.17",
    "pytest-asyncio>=0.19,<0.20",
    "schemathesis>=3.17,<4",
    "datamodel-code-generator>=0.13,<0.14",
    "iscc-samples>=0.4,<0.5",
]

[tool.uv]
default-groups = "all"

[tool.uv.build-backend]
module-name = "iscc_web"
module-root = ""

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[tool.black]
line-length = 100
target-version = ['py38']
preview = true

[tool.datamodel-codegen]
input = "iscc_web/static/docs/openapi.yaml"
output = "iscc_web/api/schema.py"
encoding = "UTF-8"
disable-timestamp = true
target-python-version = "3.8"

[tool.poe.tasks]
formatopenapi = { cmd = "uv run python -m develop.format_openapi", help = "Reformat openapi.yaml"}
codegen = { cmd = "uv run datamodel-codegen", help="Build code from OpenAPI Schema"}
format = { cmd = "uv run black .", help = "Code style formating with black" }
lf = { cmd = "uv run python -m develop.lf", help = "Convert line endings to LF" }
test = { cmd = "uv run pytest", help = "Run tests" }
run = { cmd = "uv run uvicorn iscc_web.asgi:application --reload", help = "Run dev server"}
all = ["formatopenapi", "codegen", "format", "lf", "test"]
