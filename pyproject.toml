[project]
name = "iscc-web"
version = "0.2.0"
description = "ISCC - Generator Web Application"
authors = [{ name = "Titusz", email = "tp@py7.de" }]
requires-python = ">=3.10,<3.13"
readme = "README.md"
license = "Apache-2.0"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "blacksheep",
    "uvicorn",
    "aiofiles",
    "iscc-sdk",
    "iscc-core",
    "httpx",
    "pathvalidate",
    "aiofile",
    "jinja2-simple-tags",
    "gunicorn",
    "sentry-sdk",
    "watchfiles",
    "pydantic-settings",
]

[project.urls]
Homepage = "https://github.com/iscc/iscc-web"

[project.scripts]
iscc-web = "iscc_web.main:main"

[dependency-groups]
dev = [
    "pytest",
    "black",
    "poethepoet",
    "pytest-asyncio",
    "schemathesis",
    "datamodel-code-generator",
    "iscc-samples",
]

[tool.uv]
default-groups = "all"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
line-length = 100
target-version = ['py38']
preview = true

[tool.datamodel-codegen]
input = "iscc_web/static/docs/openapi.yaml"
output = "iscc_web/api/schema.py"
output-model-type = "pydantic_v2.BaseModel"
input-file-type = "openapi"
encoding = "UTF-8"
disable-timestamp = true
enable-version-header = true
target-python-version = "3.11"
use-schema-description = true


[tool.pytest.ini_options]
addopts = "-p no:warnings"


[tool.poe.tasks]
formatopenapi = { cmd = "uv run python -m develop.format_openapi", help = "Reformat openapi.yaml"}
codegen = { cmd = "uv run datamodel-codegen", help="Build code from OpenAPI Schema"}
format = { cmd = "uv run black .", help = "Code style formating with black" }
lf = { cmd = "uv run python -m develop.lf", help = "Convert line endings to LF" }
test = { cmd = "uv run pytest", help = "Run tests" }
run = { cmd = "uv run uvicorn iscc_web.asgi:application --reload", help = "Run dev server"}
all = ["formatopenapi", "codegen", "format", "lf", "test"]
