# Documentation site of iscc-web, published at web.iscc.codes from main by .github/workflows/docs.yml.
# Theme: zensical-iscc (pyproject.toml, docs group); its reference configuration is zensical.toml in
# github.com/iscc/zensical-iscc. Build with `uv run poe docs-build`, check with `uv run poe docs-check`.

[project]
site_name = "iscc-web"
site_description = "Microservice for generating International Standard Content Codes (ISCC, ISO 24138) for media files."
site_author = "Titusz Pan"
site_url = "https://web.iscc.codes/"
repo_url = "https://github.com/iscc/iscc-web"
repo_name = "iscc/iscc-web"
edit_uri = "edit/main/docs/"
copyright = "Copyright © 2022-2026 The Authors" # the theme adds the ISCC links

# Each page sets its navigation icon with `icon: lucide/<name>` in its front matter.
# The last page in the navigation is "For Coding Agents".
nav = [
    { "Home" = "index.md" },
    { "Tutorials" = [
        "tutorials/getting-started.md",
    ]},
    { "How-to Guides" = [
        "howto/deployment.md",
        "howto/configuration.md",
        "howto/restrict-access.md",
    ]},
    { "Explanation" = [
        "explanation/architecture.md",
    ]},
    { "Reference" = [
        "reference/rest-api.md",
    ]},
    { "Development" = [
        "development/contributing.md",
        "development/changelog.md",
    ]},
    { "For Coding Agents" = "for-coding-agents.md" },
]

[project.extra.iscc]
tagline = "ISCC Generator Microservice"
copy_page = true
chat = false # iscc.ai does not serve web.iscc.codes

# Related ISCC sites for the "Projects" menu in the header, in display order.
[[project.extra.iscc.related]]
name = "iscc-web"
link = "https://web.iscc.codes/"
description = "Service that generates ISCC codes for media files"

[[project.extra.iscc.related]]
name = "ISCC Specification"
link = "https://iscc.codes/"
description = "The International Standard Content Code, ISO 24138"

[[project.extra.iscc.related]]
name = "iscc-hub"
link = "https://hub.iscc.codes/"
description = "Timestamping service for signed content declarations"

[[project.extra.iscc.related]]
name = "iscc-search"
link = "https://search.iscc.codes/"
description = "Similarity search engine for ISCC codes"

[[project.extra.iscc.related]]
name = "iscc-monitor"
link = "https://monitor.iscc.codes/"
description = "Verifies and mirrors the transparency logs of ISCC hubs"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/iscc/iscc-web"

# Fonts, palette, logo, favicon and the default features come from the theme.
[project.theme]
name = "zensical_iscc"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}

[project.markdown_extensions.toc]
permalink = true

[project.markdown_extensions.pymdownx]
betterem = {}
caret = {}
details = {}
inlinehilite = {}
keys = {}
magiclink = {}
mark = {}
smartsymbols = {}
tasklist = { custom_checkbox = true }
tilde = {}

[project.markdown_extensions.pymdownx.emoji]
emoji_generator = "zensical.extensions.emoji.to_svg"
emoji_index = "zensical.extensions.emoji.twemoji"

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true

[project.markdown_extensions.pymdownx.superfences]
custom_fences = [{ name = "mermaid", class = "mermaid" }]

[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
combine_header_slug = true

# Every page gets the abbreviation tooltips. The file lives outside docs/, so it is not a page itself.
[project.markdown_extensions.pymdownx.snippets]
auto_append = ["includes/abbreviations.md"]
